<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyCAD</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="main">
    <div id="header">
      <div id="toolbar">
        <div>
          <button id="undo-button" class="tooltip">
            <img src="/icons/undo.svg" alt="Undo" width="24px" height="24px" />
            <div class="tooltip-text undo-tooltip">(CTRL + Z) Undo</div>
          </button>
          <button id="redo-button" class="tooltip">
            <img src="/icons/redo.svg" alt="Redo" width="24px" height="24px" />
            <div class="tooltip-text redo-tooltip">(CTRL + Shift + Z) Redo</div>
          </button>
        </div>
        <div id="tools" class="container">
          <button class="tool tooltip" id="move">
            <img src="/icons/move.svg" alt="Move" width="24px" height="24px" />
            <div class="tooltip-text">(g) Move</div>
          </button>
          <button class="tool tooltip" id="scale">
            <img src="/icons/scale.svg" alt="Scale" width="24px" height="24px" />
            <div class="tooltip-text">(s) Scale</div>
          </button>
          <button class="tool tooltip" id="rotate">
            <img src="/icons/rotate.svg" alt="Rotate" width="24px" height="24px" />
            <div class="tooltip-text">(r) Rotate</div>
          </button>
          <button class="tool tooltip" id="paint-button">
            <img src="/icons/paint-bucket.svg" alt="Paint" width="24px" height="24px" />
            <div class="tooltip-text">(p) Paint</div>
          </button>
        </div>
        <div id="primatives" class="container">
          <div class="dropdown">
            <button id="primatives-button" class="tooltip">+ Add Shape
              <div class="tooltip-text">(CTRL + Space) Add Shape</div>
            </button>
            <div class="dropdown-content" id="primatives-dropdown">
              <button class="primitive" id="cube">Cube</button>
              <button class="primitive" id="sphere">Sphere</button>
              <button class="primitive" id="cylinder">Cyllinder</button>
              <button class="primitive" id="cone">Cone</button>
              <button class="primitive" id="torus">Torus</button>
              <button class="primitive" id="wedge">Wedge</button>
            </div>
          </div>
        </div>
        <div id="modifiers" class="container">
          <button class="modifier tooltip" id="merge">
            <img src="/icons/merge.svg" alt="Merge" width="24px" height="24px" />
            <div class="tooltip-text">(CTRL + m)
              Merge</div>
          </button>
          <button class="modifier tooltip" id="subtract">
            <img src="/icons/subtract.svg" alt="Subtract" width="24px" height="24px" />
            <div class="tooltip-text">(CTRL + o)
              Subtract</div>
          </button>
          <button class="modifier tooltip" id="intersect">
            <img src="/icons/intersect.svg" alt="Intersect" width="24px" height="24px" />
            <div class="tooltip-text">(CTRL + i)
              Intersect</div>
          </button>
        </div>
        <div id="patterns" class="container">
          <button class="pattern tooltip" id="circular">
            <img src="/icons/circular-pattern.svg" alt="Circular" width="24px" height="24px" />
            <div class="tooltip-text">Circular Pattern</div>
          </button>
          <button class="pattern tooltip" id="rectangular">
            <img src="/icons/grid-pattern.svg" alt="Rect" width="24px" height="24px" />
            <div class="tooltip-text">Rectangular Pattern</div>
          </button>
        </div>
      </div>
      <button id="export"><p id="download-icon">🢳</p><p id="download-text">Export Selected STLs</p></button>
    </div>

    <div id="viewport">
      <canvas id="bg"></canvas>

      <div class="overlay" id="editor-controls"></div>
      <canvas id="viewcube-canvas"></canvas>
    </div>


    <footer id="footer">
      <div id="camera-type">
        <button id="cam-switch">Orthographic</button>
      </div>
      <p id="statement">EasyCAD 2026 All Rights Reserved</p>
      <p id="selected">Nothing selected</p>
    </footer>

    <script type="module" src="./src/scripts/keybinds.js"></script>
    <script type="module" src="./src/scripts/buttons.js"></script>
    <script type="module" src="./src/scripts/main.js"></script>
  </div>
</body>

</html>
